# Runtime configuration template.
# The application uses MySQL only when DATABASE_URL, DATABASE_USERNAME and
# DATABASE_PASSWORD are all configured. Otherwise it creates and initializes
# the embedded SQLite database at SQLITE_DATABASE_PATH (or the runtime default).
# Supports `${ENV_NAME}` and `${ENV_NAME:default_value}` for other settings.

site:
  # The only external origin accepted as a post-login return target.
  webAppUrl: "${WEB_APP_URL:http://localhost:3001}"

# AUTH_SESSION_SECRET must be identical in datatalk-studio and datatalk-web.
# Set AUTH_COOKIE_DOMAIN to the shared parent domain when the apps use different subdomains.
# AUTH_COOKIE_SECURE controls the cookie Secure flag: true/1 forces it on,
# false/0/off forces it off (e.g. HTTP behind a terminating proxy), unset auto-enables in production.

database:
  url: "${DATABASE_URL}"
  username: "${DATABASE_USERNAME}"
  password: "${DATABASE_PASSWORD}"

reportEditLock:
  enabled: "${REPORT_EDIT_LOCK_ENABLED:false}"

resourceCenter:
  enabled: "${RESOURCE_CENTER_ENABLED:false}"

auth:
  # When false, only username/password login remains available.
  allowRegistration: "${ALLOW_REGISTRATION:true}"
  github:
    clientId: "${GITHUB_CLIENT_ID}"
    clientSecret: "${GITHUB_CLIENT_SECRET}"
    redirectUri: "${GITHUB_REDIRECT_URI:}"
  google:
    clientId: "${GOOGLE_CLIENT_ID}"
    clientSecret: "${GOOGLE_CLIENT_SECRET}"
    redirectUri: "${GOOGLE_REDIRECT_URI:}"

email:
  smtp:
    host: "${SMTP_HOST}"
    port: "${SMTP_PORT:465}"
    user: "${SMTP_USER}"
    password: "${SMTP_PASSWORD}"
    from: "${SMTP_FROM}"
    secure: "${SMTP_SECURE:true}"

sms:
  accessKeyId: "${ALIYUN_SMS_ACCESS_KEY_ID}"
  accessKeySecret: "${ALIYUN_SMS_ACCESS_KEY_SECRET}"
  signName: "${ALIYUN_SMS_SIGN_NAME}"
  templateCode: "${ALIYUN_SMS_TEMPLATE_CODE}"
  endpoint: "${ALIYUN_SMS_ENDPOINT:dysmsapi.aliyuncs.com}"
